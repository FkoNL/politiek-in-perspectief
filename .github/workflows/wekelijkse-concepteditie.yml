name: Maak en publiceer wekelijkse editie

on:
  schedule:
    # Reservepoging; een bestaande editie wordt niet opnieuw gegenereerd.
    - cron: "0,20 6 * * 1"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Publicatiedatum (YYYY-MM-DD); leeg betekent vandaag"
        required: false
        type: string
      regenerate:
        description: "Maak en publiceer een herziene versie van een bestaande editie"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wekelijkse-editie
  cancel-in-progress: false

jobs:
  maak-editie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.bewaar.outputs.commit }}
    steps:
      - name: Haal de site op
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Gebruik Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer of de editie al bestaat
        id: editie
        env:
          REQUESTED_DATE: ${{ inputs.edition_date }}
          REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate }}
        run: |
          node --input-type=module <<'NODE'
          import { access, appendFile } from "node:fs/promises";
          const date = process.env.REQUESTED_DATE || new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Amsterdam" }).format(new Date());
          const today = new Date(`${date}T00:00:00Z`);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(today.getTime()) || today.toISOString().slice(0, 10) !== date) {
            throw new Error("Ongeldige publicatiedatum: gebruik YYYY-MM-DD.");
          }
          const end = new Date(today);
          end.setUTCDate(end.getUTCDate() - (end.getUTCDay() + 6) % 7 - 1);
          const file = `edities/${end.toISOString().slice(0, 10)}.html`;
          let exists = false;
          try { await access(file); exists = true; } catch (error) { if (error.code !== "ENOENT") throw error; }
          const generate = process.env.REGENERATE === "true" || !exists;
          await appendFile(process.env.GITHUB_OUTPUT, `date=${date}\ngenerate=${generate}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, generate ? `Nieuwe editie voor ${date} wordt gemaakt en gepubliceerd.\n` : `Editie bestaat al (${file}); geen nieuwe API-aanroep. De bestaande site wordt gepubliceerd.\n`);
          NODE
      - name: Genereer editie met bronvermeldingen
        if: steps.editie.outputs.generate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITION_DATE: ${{ steps.editie.outputs.date }}
        run: node scripts/generate-weekly-edition.mjs
      - name: Bewaar de editie op main
        id: bewaar
        env:
          EDITION_DATE: ${{ steps.editie.outputs.date }}
        run: |
          git config user.name "politiek-in-perspectief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archief.html edities assets/edities
          if ! git diff --cached --quiet; then
            git commit -m "Publiceer weekeditie ${EDITION_DATE}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publiceer:
    needs: maak-editie
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.maak-editie.outputs.commit }}
