name: Maak podcastaflevering

on:
  workflow_call:
    inputs:
      edition_date:
        description: "Publicatiedatum van de weekeditie (YYYY-MM-DD)"
        required: true
        type: string
      source_ref:
        description: "Exacte commit van de gepubliceerde weekeditie"
        required: false
        default: main
        type: string
      regenerate:
        description: "Maak ook bij een bestaande aflevering opnieuw audio"
        required: false
        default: false
        type: boolean
    secrets:
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Publicatiedatum (YYYY-MM-DD); leeg betekent vandaag"
        required: false
        type: string
      regenerate:
        description: "Maak een nieuwe versie, ook als deze aflevering al bestaat"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: wekelijkse-podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.publiceer.outputs.commit }}
    steps:
      - name: Haal de gepubliceerde editie op
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'main' }}
          fetch-depth: 0
      - name: Gebruik Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bereid de aflevering voor
        id: editie
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DATE: ${{ inputs.edition_date }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          REGENERATE: ${{ inputs.regenerate }}
        run: node scripts/generate-podcast-script.mjs --prepare
      - name: Zorg voor audioverwerking
        if: steps.editie.outputs.exists != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Haal bewaarde tekst en audiofragmenten op
        if: steps.editie.outputs.exists != 'true'
        uses: actions/cache/restore@v4
        id: fragmenten
        with:
          path: .podcast-cache
          key: podcast-${{ steps.editie.outputs.source_sha }}-${{ hashFiles('prompts/podcast.md', 'scripts/generate-podcast-script.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            podcast-${{ steps.editie.outputs.source_sha }}-${{ hashFiles('prompts/podcast.md', 'scripts/generate-podcast-script.mjs') }}-
      - name: Maak het luisterscript
        if: steps.editie.outputs.exists != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITION_DATE: ${{ steps.editie.outputs.date }}
        run: node scripts/generate-podcast-script.mjs
      - name: Genereer de rustige volledige aflevering
        if: steps.editie.outputs.exists != 'true'
        id: audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITION_DATE: ${{ steps.editie.outputs.date }}
          PODCAST_BRANCH: ${{ steps.editie.outputs.branch }}
          REGENERATE_AUDIO: ${{ inputs.regenerate }}
        run: node scripts/generate-podcast-trial.mjs
      - name: Werk de openbare podcastfeed bij
        if: steps.editie.outputs.exists != 'true'
        run: node scripts/generate-podcast-feed.mjs
      - name: Bewaar afgeronde tekst en audiofragmenten
        if: always() && steps.editie.outputs.exists != 'true'
        uses: actions/cache/save@v4
        with:
          path: .podcast-cache
          key: ${{ steps.fragmenten.outputs.cache-primary-key }}
      - name: Bewaar MP3, script en metadata als download
        if: steps.editie.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: podcast-${{ steps.editie.outputs.date }}-${{ github.run_id }}
          path: |
            ${{ steps.audio.outputs.mp3 }}
            ${{ steps.audio.outputs.transcript }}
            ${{ steps.audio.outputs.metadata }}
          if-no-files-found: error
          retention-days: 30
      - name: Publiceer aflevering en feed
        id: publiceer
        if: steps.editie.outputs.exists != 'true'
        env:
          EDITION_DATE: ${{ steps.editie.outputs.date }}
          MP3_FILE: ${{ steps.audio.outputs.mp3 }}
          SCRIPT_FILE: ${{ steps.audio.outputs.transcript }}
          META_FILE: ${{ steps.audio.outputs.metadata }}
          SOURCE_SHA: ${{ steps.editie.outputs.source_sha }}
        run: |
          git config user.name "politiek-in-perspectief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "podcast/scripts/${EDITION_DATE}.json" "$MP3_FILE" "$SCRIPT_FILE" "$META_FILE"
          git commit -m "Publiceer podcastaflevering ${EDITION_DATE}"
          git fetch origin main
          git rebase origin/main
          SOURCE_FILE=$(node --input-type=module -e 'import {publicationPeriod} from "./scripts/generate-podcast-script.mjs"; console.log(publicationPeriod(process.env.EDITION_DATE).edition)')
          test "$(git hash-object "$SOURCE_FILE")" = "$SOURCE_SHA" || { echo "Broneditie gewijzigd; podcast niet gepubliceerd"; exit 1; }
          node scripts/generate-podcast-feed.mjs
          git add podcast.xml
          git commit --amend --no-edit
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publiceer-feed:
    needs: podcast
    if: needs.podcast.outputs.commit != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.podcast.outputs.commit }}
