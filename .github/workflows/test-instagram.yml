name: Controleer Instagramflow
on:
  pull_request:
    paths:
      - 'scripts/instagram_*.py'
      - 'tests/test_instagram*.py'
      - '.github/workflows/*instagram*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'Pillow>=11,<13' PyYAML
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation2
      - run: python -m unittest discover -s tests -p 'test_instagram*.py'
      - name: Controleer workflow-YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in Path('.github/workflows').glob('*instagram*.yml'):
              with path.open() as stream:
                  assert yaml.safe_load(stream)['jobs']
          PY
